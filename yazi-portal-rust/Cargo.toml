[package]
name = "yazi-portal-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
smol = "2"

zbus = { version = "5", default-features = false, features = ["async-io"] }

dirs = "6.0.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = [
	"parse",
	"serde",
] }
